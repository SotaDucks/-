<style>
/* Layout: full-bleed 3D stage; one frosted instrument panel docked top-left (bottom sheet on phones). */
:root {
  --stage: #eceef5;        /* scene background, lavender-tinged white */
  --floor: #f4f5f9;
  --grid: #dcdfeb;
  --grid-major: #c7cbdd;
  --box-top: #f8f9fc;
  --box-side: #c3c8dc;
  --box-edge: #a9afc9;
  --panel: rgba(250, 251, 254, 0.88);
  --panel-line: #d7dbe8;
  --ink: #1a2142;
  --muted: #5b6386;
  --fish: #24378a;
  --accent: #dd6a1c;        /* targets, trajectory: complement of the fish blue */
  --accent-ink: #ffffff;
  --chip: #e3e7f3;
  --debug: #0f9b8e;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #10152a; --floor: #141a32; --grid: #1e2643; --grid-major: #2c365e;
    --box-top: #2a3258; --box-side: #1b2242; --box-edge: #3c4775;
    --panel: rgba(20, 26, 48, 0.86); --panel-line: #2c355a;
    --ink: #e7eaf7; --muted: #9ba4c8; --fish: #9fb4ff;
    --accent: #f2913f; --accent-ink: #1a1206; --chip: #232b4d; --debug: #3ed6c4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #10152a; --floor: #141a32; --grid: #1e2643; --grid-major: #2c365e;
  --box-top: #2a3258; --box-side: #1b2242; --box-edge: #3c4775;
  --panel: rgba(20, 26, 48, 0.86); --panel-line: #2c355a;
  --ink: #e7eaf7; --muted: #9ba4c8; --fish: #9fb4ff;
  --accent: #f2913f; --accent-ink: #1a1206; --chip: #232b4d; --debug: #3ed6c4;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--stage); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  overflow: hidden;
}
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; outline: none; }
.brand {
  position: fixed; pointer-events: none; margin: 0;
  left: max(18px, env(safe-area-inset-left, 0px)); top: max(14px, env(safe-area-inset-top, 0px));
  font-family: var(--font-display); font-weight: 900; font-size: 26px; letter-spacing: 0.06em; color: var(--fish); line-height: 1; opacity: 0.85;
}
.redrop {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: max(14px, env(safe-area-inset-top, 0px));
  font: inherit; font-size: 12px; color: var(--ink); cursor: pointer;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px; padding: 4px 12px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.redrop:hover { border-color: var(--ink); }
.redrop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.redrop kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-left: 4px; }
/* multiplayer status chip under the brand */
.net {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: max(50px, calc(env(safe-area-inset-top, 0px) + 46px));
  display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px; padding: 3px 4px 3px 10px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.net[hidden] { display: none; }
.net .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.net.on .dot { background: var(--debug); }
.net b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); }
.net button { font: inherit; font-size: 12px; color: var(--ink); background: var(--chip); cursor: pointer; border: 0; border-radius: 999px; padding: 2px 10px; }
.net button:hover { background: var(--panel-line); }
/* bottom HUD: stamina always, charge only while the fish is curled */
.hud {
  position: fixed; left: 50%; transform: translateX(-50%); pointer-events: none;
  bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  width: min(320px, calc(100% - 48px)); display: grid; gap: 7px; justify-items: center;
}
.bar { width: 100%; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; border-radius: 3px; transform-origin: left; background: var(--fish); }
.bar.charge { height: 8px; opacity: 0; transition: opacity 0.12s; }
.bar.charge i { background: var(--accent); transform: scaleX(0); }
.bar.charge.on { opacity: 1; }
.hint { margin: 2px 0 0; font-size: 12px; color: var(--muted); text-align: center; transition: opacity 0.8s; }
.hint.gone { opacity: 0; }
.tune {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: max(52px, calc(env(safe-area-inset-top, 0px) + 50px));
  width: min(300px, calc(100% - 32px)); max-height: calc(100vh - 140px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 12px 14px;
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  font-size: 12px; display: grid; gap: 10px;
}
.tune[hidden] { display: none; }
.tune header { display: flex; align-items: baseline; justify-content: space-between; }
.tune header b { font-size: 13px; }
.tune header small, .tune .desc { color: var(--muted); }
.tune h3 { margin: 4px 0 -2px; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; color: var(--muted); }
.tune label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.tune label.chk input { grid-column: auto; width: auto; justify-self: end; }
.tune label input { grid-column: 1 / -1; width: 100%; accent-color: var(--fish); margin: 0; }
.tune .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.tune .desc { grid-column: 1 / -1; font-size: 11px; line-height: 1.4; }
.tune .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.tune button { font: inherit; font-size: 12px; color: var(--ink); background: transparent; cursor: pointer; border: 1px solid var(--panel-line); border-radius: 999px; padding: 3px 11px; }
.tune button:hover { border-color: var(--ink); }
.err { position: fixed; left: 16px; top: 56px; padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { TUNE_DEFAULTS, Fish, World, SEGS, N, TOTAL, CENTERS, BOUNDS } from './shared/fish-sim.mjs';
import { packFish, applyImpact, resolveFishPair, POSE_LEN, LEGACY_POSE_LEN, STRIDE, HEADER } from './shared/fish-collision.mjs';
import { TestFishController } from './shared/test-fish.mjs';

// ---------------- world ----------------
const BOXES = [
  { cx: 4.6, cz: 0, hx: 1.1, hz: 1.3, h: 0.55 },
  { cx: -3.5, cz: -3.0, hx: 1.6, hz: 1.0, h: 0.35 },
  { cx: 1.0, cz: -4.2, hx: 0.6, hz: 0.6, h: 0.9 },
  { cx: -2.0, cz: 3.6, hx: 1.2, hz: 0.8, h: 0.22 },
  { cx: 8.0, cz: -4.0, hx: 2.0, hz: 1.6, h: 0.4 },
];
const world = new World(BOXES);
const fish = new Fish(world);

// ---------------- renderer ----------------
const canvas = document.getElementById('view');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  const p = document.createElement('p'); p.className = 'err';
  p.textContent = '这个浏览器无法创建 WebGL 画布，场景无法显示。请换用支持 WebGL 的浏览器再打开。';
  document.body.appendChild(p); throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const perspCam = new THREE.PerspectiveCamera(36, 1, 0.05, 200);
perspCam.position.set(-3.6, 3.3, 5.0);
const controls = new OrbitControls(perspCam, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.42; controls.minDistance = 2.2; controls.maxDistance = 22;
controls.target.set(0, 0.2, 0);
// left button is the jump input; orbit with right button, zoom with wheel / middle, two fingers on touch
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_ROTATE };

const hemi = new THREE.HemisphereLight(0xffffff, 0x8f97b8, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// floor with a millimetre-paper style grid (2 m tile, 0.5 m minor lines)
function gridTexture(t) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = t.floor; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = t.grid; g.lineWidth = 2;
  for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(k * 128, 0); g.lineTo(k * 128, 512); g.moveTo(0, k * 128); g.lineTo(512, k * 128); g.stroke(); }
  g.strokeStyle = t.gridMajor; g.lineWidth = 4;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(512, 0); g.moveTo(0, 0); g.lineTo(0, 512); g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(40, 40);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const floorMat = new THREE.MeshStandardMaterial({ roughness: 0.95, metalness: 0 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor);

const boxTop = new THREE.MeshStandardMaterial({ roughness: 0.9 });
const boxSide = new THREE.MeshStandardMaterial({ roughness: 0.9 });
const edgeMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.7 });
const boxMeshes = [];
for (const b of BOXES) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(b.hx * 2, b.h, b.hz * 2), [boxSide, boxSide, boxTop, boxTop, boxSide, boxSide]);
  m.position.set(b.cx, b.h / 2, b.cz); m.castShadow = m.receiveShadow = true;
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), edgeMat);
  m.add(e); scene.add(m); boxMeshes.push(m);
}

// ---------------- procedural swordfish (skinned to the rigid segments) ----------------
const X0 = TOTAL / 2;
function monotone(xs, ys) { // Fritsch–Carlson monotone cubic
  const n = xs.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return (x) => {
    if (x <= xs[0]) return ys[0]; if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (xs[i + 1] < x) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
// arc length from bill tip, half-height (dorsal), half-width (lateral), vertical center offset
const PROFILE = [
  [0.00, 0.003, 0.004, 0], [0.12, 0.007, 0.014, 0], [0.30, 0.012, 0.025, 0], [0.48, 0.019, 0.034, 0],
  [0.54, 0.040, 0.046, -0.006], [0.62, 0.076, 0.060, -0.010], [0.74, 0.122, 0.075, -0.004],
  [0.90, 0.160, 0.088, 0], [1.05, 0.172, 0.092, 0], [1.22, 0.162, 0.087, 0], [1.40, 0.130, 0.073, 0],
  [1.58, 0.094, 0.055, 0], [1.74, 0.062, 0.038, 0], [1.88, 0.038, 0.027, 0], [1.98, 0.031, 0.031, 0],
  [2.06, 0.026, 0.020, 0], [2.12, 0.006, 0.006, 0],
];
const pu = PROFILE.map((p) => p[0]);
const Hf = monotone(pu, PROFILE.map((p) => p[1]));
const Wf = monotone(pu, PROFILE.map((p) => p[2]));
const Yf = monotone(pu, PROFILE.map((p) => p[3]));
const topY = (u) => Yf(u) + Hf(u), botY = (u) => Yf(u) - Hf(u);

function skinOf(u) {
  if (u <= BOUNDS[1]) return [0, 0, 1, 0];
  if (u <= CENTERS[1]) return [1, 1, 1, 0];
  if (u >= CENTERS[N - 1]) return [N - 1, N - 1, 1, 0];
  let i = 1; while (CENTERS[i + 1] < u) i++;
  const t = (u - CENTERS[i]) / (CENTERS[i + 1] - CENTERS[i]); const s = t * t * (3 - 2 * t);
  return [i, i + 1, 1 - s, s];
}
class GeoBuilder {
  constructor() { this.pos = []; this.col = []; this.si = []; this.sw = []; this.idx = []; }
  vert(x, y, z, c) {
    this.pos.push(x, y, z); this.col.push(c.r, c.g, c.b);
    const s = skinOf(X0 - x); this.si.push(s[0], s[1], 0, 0); this.sw.push(s[2], s[3], 0, 0);
    return this.pos.length / 3 - 1;
  }
  tri(a, b, c) { this.idx.push(a, b, c); }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(this.si, 4));
    g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(this.sw, 4));
    g.setIndex(this.idx); g.computeVertexNormals();
    return g;
  }
}
const C = (hex) => new THREE.Color(hex);
const PAL = {
  back: C('#1b2a72'), flank: C('#5776c9'), belly: C('#e8edf6'),
  billTop: C('#202b5a'), billBot: C('#8790b0'),
  fin: C('#1e2b6c'), finTip: C('#3e5cbe'), eye: C('#0b0f22'), sclera: C('#d9e0ee'),
};
const tmpC = new THREE.Color();
function bodyColor(u, t) { // t: -1 belly .. +1 back
  const bill = u < 0.5;
  if (bill) return tmpC.copy(PAL.billBot).lerp(PAL.billTop, THREE.MathUtils.smoothstep(t, -0.4, 0.4)).clone();
  let c;
  if (t > 0.1) c = PAL.flank.clone().lerp(PAL.back, THREE.MathUtils.smoothstep(t, 0.1, 0.65));
  else c = PAL.belly.clone().lerp(PAL.flank, THREE.MathUtils.smoothstep(t, -0.45, 0.1));
  return c;
}
function buildBody() {
  const gb = new GeoBuilder(), R = 14;
  const us = [0, 0.03, 0.1, 0.2, 0.3, 0.4, 0.47, 0.51, 0.55];
  for (let u = 0.6; u < 2.1; u += 0.045) us.push(+u.toFixed(3));
  us.push(2.1, 2.12);
  const rings = [];
  for (const u of us) {
    const H = Hf(u), W = Wf(u), yc = Yf(u), ring = [];
    for (let j = 0; j < R; j++) {
      const a = (j / R) * Math.PI * 2;
      const s = Math.sin(a), c = Math.cos(a);
      const y = yc + H * s * (s > 0 ? 1 : 0.94), z = W * c;
      ring.push(gb.vert(X0 - u, y, z, bodyColor(u, s)));
    }
    rings.push(ring);
  }
  for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < R; j++) {
    const a = rings[i][j], b = rings[i][(j + 1) % R], c = rings[i + 1][j], d = rings[i + 1][(j + 1) % R];
    gb.tri(a, b, c); gb.tri(b, d, c);
  }
  // eyes
  for (const sgn of [1, -1]) {
    const u = 0.665, x = X0 - u, y = Yf(u) + Hf(u) * 0.28, z = sgn * Wf(u) * 0.9;
    for (const [rad, col, off] of [[0.033, PAL.sclera, -0.006], [0.022, PAL.eye, 0.004]]) {
      const ico = new THREE.IcosahedronGeometry(rad, 1); const p = ico.attributes.position; const base = gb.pos.length / 3;
      for (let k = 0; k < p.count; k++) gb.vert(x + p.getX(k), y + p.getY(k), z + sgn * off + p.getZ(k) * 0.55, col);
      const id = ico.index ? ico.index.array : [...Array(p.count).keys()];
      for (let k = 0; k < id.length; k += 3) gb.tri(base + id[k], base + id[k + 1], base + id[k + 2]);
    }
  }
  return gb.build();
}
function buildFins() {
  const gb = new GeoBuilder();
  function fin(contour, to3, rootFn) { // contour: 2D points; to3 maps to body coords; rootFn: 0 at root .. 1 at tip
    const v2 = contour.map((p) => new THREE.Vector2(p[0], p[1]));
    const tris = THREE.ShapeUtils.triangulateShape(v2, []);
    const ids = contour.map((p) => { const q = to3(p); return gb.vert(q[0], q[1], q[2], PAL.fin.clone().lerp(PAL.finTip, rootFn(p))); });
    for (const t of tris) gb.tri(ids[t[0]], ids[t[1]], ids[t[2]]);
  }
  const dorsal = [[0.80, -0.02], [0.83, 0.10], [0.87, 0.22], [0.92, 0.33], [0.96, 0.365], [0.98, 0.33], [0.99, 0.24], [1.01, 0.14], [1.05, 0.07], [1.10, 0.03], [1.16, -0.02]];
  fin(dorsal, (p) => [X0 - p[0], topY(p[0]) + p[1], 0], (p) => Math.max(0, p[1]) / 0.36);
  fin([[1.85, -0.01], [1.88, 0.045], [1.905, 0.05], [1.925, -0.01]], (p) => [X0 - p[0], topY(p[0]) + p[1], 0], (p) => Math.max(0, p[1]) / 0.05);

    if (rgbRT) { rgbRT.depthTexture.dispose(); rgbRT.dispose(); nrmRT.dispose(); }

  orthoCam.updateProjectionMatrix();

  camShift.set(0, 0, 0);

    orthoCam.updateMatrixWorld();
    camRight.setFromMatrixColumn(orthoCam.matrixWorld, 0); camUp.setFromMatrixColumn(orthoCam.matrixWorld, 1);
    const texel = (2 * hh / orthoCam.zoom) / h;
    const x = orthoCam.position.dot(camRight), y = orthoCam.position.dot(camUp);
    camShift.addScaledVector(camRight, Math.round(x / texel) * texel - x).addScaledVector(camUp, Math.round(y / texel) * texel - y);
    orthoCam.position.add(camShift); orthoCam.updateMatrixWorld();

  const bg = scene.background, fog = scene.fog;
  scene.overrideMaterial = normalMat; scene.background = null; scene.fog = null;
  renderer.setRenderTarget(nrmRT); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(scene, orthoCam);
  scene.overrideMaterial = null; scene.background = bg; scene.fog = fog;
  orthoCam.position.sub(camShift);
  const u = pixelMat.uniforms;
  u.tDiffuse.value = rgbRT.texture; u.tDepth.value = rgbRT.depthTexture; u.tNormal.value = nrmRT.texture;
  u.resolution.value.set(w, h, 1 / w, 1 / h);
  u.cameraNear.value = orthoCam.near; u.cameraFar.value = orthoCam.far;
  u.depthEdge.value = viz.edgeDepth; u.normalEdge.value = viz.edgeNormal; u.depthThresh.value = viz.edgeThresh; u.levels.value = Math.round(viz.levels);
  renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
}

// hold left button to charge, release to jump toward the pointer
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), aimPoint = new THREE.Vector3();
let holding = false, pointerId = null, hasAim = false;
function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function updateAim() { // pointer -> point on floor / step tops (falls back to the ground plane)
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([floor, ...boxMeshes], false)[0];
  if (hit) { aimPoint.copy(hit.point); hasAim = true; }
  else hasAim = !!ray.ray.intersectPlane(groundPlane, aimPoint);
}
function aimDir() {
  const c = fish.com();
  return hasAim ? [aimPoint.x - c[0], 0, aimPoint.z - c[2]] : fish.heading();
}
canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || holding) return;
  holding = true; pointerId = e.pointerId; setPointer(e); updateAim();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  fish.beginCharge(); // if the fish is still busy, charging starts as soon as it comes to rest
});
canvas.addEventListener('pointermove', (e) => {
  setPointer(e);
  if (holding && e.pointerId === pointerId && e.pointerType === 'mouse' && (e.buttons & 1) === 0) endHold(e); // missed mouseup
});
canvas.addEventListener('lostpointercapture', (e) => { if (holding && e.pointerId === pointerId) endHold(null); }); // aim from the last move, not this event
function endHold(e) {
  if (!holding || (e && e.pointerId !== pointerId)) return;
  holding = false; pointerId = null;
  if (e) setPointer(e);
  updateAim();
  fish.release(aimDir());
}
window.addEventListener('pointerup', endHold);
window.addEventListener('pointercancel', endHold);
window.addEventListener('blur', () => endHold(null));

// aim preview: dashed ground line from the fish toward the pointer, ring at the landing spot it would reach now
const aimLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), aimMat);
aimLine.renderOrder = 6; aimLine.visible = false; scene.add(aimLine);
const aimRing = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.2, 40), aimRingMat);
aimRing.rotation.x = -Math.PI / 2; aimRing.renderOrder = 6; aimRing.visible = false; scene.add(aimRing);
function updateAimVisual() {
  const show = holding && hasAim;
  aimLine.visible = aimRing.visible = show;
  if (!show) return;
  const c = fish.com(); const d = aimDir(); const l = Math.hypot(d[0], d[2]) || 1;
  const dist = fish.manualReach(fish.chargePower());
  const x = c[0] + d[0] / l * dist, z = c[2] + d[2] / l * dist;
  const p = aimLine.geometry.attributes.position;
  p.setXYZ(0, c[0], world.height(c[0], c[2]) + 0.012, c[2]);
  p.setXYZ(1, x, world.height(x, z) + 0.012, z);
  p.needsUpdate = true; aimLine.geometry.computeBoundingSphere(); aimLine.computeLineDistances();
  aimRing.position.set(x, world.height(x, z) + 0.012, z);
  const ready = fish.charging();
  aimMat.opacity = ready ? 0.95 : 0.4; aimRingMat.opacity = ready ? 0.95 : 0.4;
  aimRing.scale.setScalar(fish.chargePower() >= 1 ? 1 + 0.08 * Math.sin(performance.now() / 60) : 1);
}

// Camera focus that ignores the fish's small motions (idle tail twitch, landing wobble, charge curl).
// Hysteresis: the focus stays put until the fish has really moved away, then glides over and parks again.
// Height follows the ground under the fish, not its bobbing centre of mass.
function makeFollow(fish, world) {
  const t = [0, 0.2, 0];
  let chasing = true;
  const START = 0.45, STOP = 0.04, RATE = 3.2;
  return {
    target: t,
    snap(p) { t[0] = p[0]; t[1] = world.height(p[0], p[2]) + 0.2; t[2] = p[2]; chasing = false; },
    update(dt) {
      const c = fish.com();
      const ex = c[0] - t[0], ez = c[2] - t[2], e = Math.hypot(ex, ez);
      const moving = fish.state === 'air' && fish.stateT > 0.05; // not during the slap: the COM jerks backwards before take-off
      if (!chasing && (e > START || moving)) chasing = true;
      if (chasing && !moving && fish.state !== 'drop' && e < STOP) chasing = false;
      const k = 1 - Math.exp(-RATE * dt);
      if (chasing) { t[0] += ex * k; t[2] += ez * k; }
      t[1] += (world.height(t[0], t[2]) + 0.2 - t[1]) * k;
      return t;
    },
  };
}
const follow = makeFollow(fish, world);

// Shadow map: follow the (already filtered) camera focus, snapped to whole shadow texels in light space,
// so shadow edges don't crawl when the focus glides.
const SUN_OFFSET = new THREE.Vector3(-3, 9, 4);
const sunDir = SUN_OFFSET.clone().negate().normalize();
const sunRight = new THREE.Vector3().crossVectors(sunDir, new THREE.Vector3(0, 1, 0)).normalize();
const sunUp = new THREE.Vector3().crossVectors(sunRight, sunDir);
const sunTexel = (sun.shadow.camera.right - sun.shadow.camera.left) / sun.shadow.mapSize.x;
const sunFocus = new THREE.Vector3();
function placeSun(t) {
  sunFocus.fromArray(t); sunFocus.y = 0;
  const a = Math.round(sunFocus.dot(sunRight) / sunTexel) * sunTexel, b = Math.round(sunFocus.dot(sunUp) / sunTexel) * sunTexel, c = sunFocus.dot(sunDir);
  sunFocus.copy(sunRight).multiplyScalar(a).addScaledVector(sunUp, b).addScaledVector(sunDir, c);
  sun.target.position.copy(sunFocus); sun.position.copy(sunFocus).add(SUN_OFFSET);
}

// ---------------- multiplayer (server-arbitrated impacts, see server/) ----------------
// Each owner simulates its fish; only the server awards player/player impulses.
// Short interpolation hides packet jitter without a second client-side collision.
const NET_HZ = 20, NET_DELAY = 60;
const RELAY = new URLSearchParams(location.search).get('relay') || 'wss://xianyu-relay.xianyu-relay.workers.dev';
const roomId = (() => {
  const u = new URL(location.href);
  let r = (u.searchParams.get('room') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 24);
  if (!r) { r = Math.random().toString(36).slice(2, 7); u.searchParams.set('room', r); history.replaceState(null, '', u); }
  return r;
})();
const remotes = new Map(); // peerId -> { rig, bones, meshes, mats, snaps, off, dropN }
function tintFor(id) { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return new THREE.Color().setHSL((h % 360) / 360, 0.55, 0.78); }
function addRemote(id) {
  let r = remotes.get(id);
  if (r) return r;
  const bm = bodyMat.clone(), fm = finMat.clone();
  bm.color.copy(tintFor(id)); fm.color.copy(bm.color);
  r = Object.assign(makeRig(bm, fm), { mats: [bm, fm], snaps: [], off: null, dropN: -1 });
  for (const m of r.meshes) m.visible = false; // until the first pose arrives
  remotes.set(id, r);
  return r;
}
function removeRemote(id) {
  const r = remotes.get(id); if (!r) return;
  r.dispose(); for (const m of r.mats) m.dispose();
  remotes.delete(id);
}
let lastImpactSeq = 0, serverCollisions = null;
function sendPose() {
  if (ws?.readyState !== WebSocket.OPEN) return;
  if (serverCollisions) ws.send(packFish(fish, performance.now(), dropCount, lastImpactSeq));
  else {
    const legacy = new Float64Array(LEGACY_POSE_LEN);
    legacy[0] = performance.now(); legacy[1] = dropCount;
    fish.bodies.forEach((b, i) => { legacy.set(b.x, 2 + i * 7); legacy.set(b.q, 5 + i * 7); });
    ws.send(legacy);
  }
}
function onPose(data, peerId) {
  const a = data instanceof ArrayBuffer ? new Float64Array(data)
    : ArrayBuffer.isView(data) ? new Float64Array(data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength)) : null;
  if (!a || (a.length !== POSE_LEN && a.length !== LEGACY_POSE_LEN) || !a.every(Number.isFinite)) return;
  const r = addRemote(peerId), s = r.snaps;
  if (r.stride && r.stride !== (a.length === POSE_LEN ? STRIDE : 7)) s.length = 0;
  r.stride = a.length === POSE_LEN ? STRIDE : 7;
  r.header = a.length === POSE_LEN ? HEADER : 2;
  if (a[1] !== r.dropN) { s.length = 0; r.dropN = a[1]; } // re-dropped: snap instead of gliding across the map
  if (s.length && a[0] <= s[s.length - 1].t) return;
  // clock offset = fastest observed transit; creeps up slowly so clock drift can't stall playback
  const o = performance.now() - a[0];
  r.off = r.off === null ? o : Math.min(o, r.off + 0.05);
  s.push({ t: a[0], a });
  if (s.length > 40) s.shift();
}
const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
function updateRemotes() {
  const now = performance.now();
  for (const r of remotes.values()) {
    const s = r.snaps; if (!s.length) continue;
    const t = now - r.off - NET_DELAY;
    while (s.length > 2 && s[1].t <= t) s.shift();
    const A = s[0], B = s[1] || A;
    const k = B.t > A.t ? THREE.MathUtils.clamp((t - A.t) / (B.t - A.t), 0, 1) : 1;
    r.bones.forEach((bone, i) => {
      const o = r.header + i * r.stride;
      bone.position.set(A.a[o] + (B.a[o] - A.a[o]) * k, A.a[o + 1] + (B.a[o + 1] - A.a[o + 1]) * k, A.a[o + 2] + (B.a[o + 2] - A.a[o + 2]) * k);
      bone.quaternion.slerpQuaternions(qa.fromArray(A.a, o + 3), qb.fromArray(B.a, o + 3), k);
    });
    for (const m of r.meshes) m.visible = true;
    r.rig.updateMatrixWorld(true);
  }
}
let ws = null, retry = 0;
function updateNetUI() {
  const n = remotes.size, up = ws && ws.readyState === WebSocket.OPEN;
  $('net').classList.toggle('on', up && n > 0);
  $('netCount').textContent = !up ? (retry ? '连接断开，重连中…' : '连接中…') : n ? `${n + 1} 人在线` : '等待朋友加入';
  if (up && serverCollisions === false) $('netCount').textContent += ' · 服务器需更新以启用互撞';
}
function connect() {
  lastImpactSeq = 0; serverCollisions = null;
  ws = new WebSocket(`${RELAY}/room/${roomId}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { retry = 0; updateNetUI(); };
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') {
      if (!(e.data instanceof ArrayBuffer) || e.data.byteLength % 8 || e.data.byteLength < 8) return;
      const a = new Float64Array(e.data); onPose(a.subarray(1), 'p' + a[0]); return;
    }
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.t === 'hello') {
      serverCollisions = m.collisions === 1;
      for (const id of m.peers) addRemote('p' + id);
      sendPose();
    }
    else if (m.t === 'join') addRemote('p' + m.id);
    else if (m.t === 'leave') removeRemote('p' + m.id);
    else if (m.t === 'impact' && Number.isSafeInteger(m.seq) && m.seq > lastImpactSeq) {
      lastImpactSeq = m.seq;
      applyImpact(fish, m, dropCount);
      sendPose(); // Acknowledge even an obsolete hit from before a re-drop.
    }
    updateNetUI();
  };
  ws.onclose = () => {
    for (const id of [...remotes.keys()]) removeRemote(id);
    retry++; updateNetUI();
    setTimeout(connect, Math.min(10000, 1000 * 2 ** Math.min(retry, 4)));
  };
}
function startNet() {
  $('net').hidden = false; $('netRoom').textContent = roomId;
  $('btnInvite').onclick = async (e) => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(location.href); b.textContent = '已复制链接'; }
    catch (_) { window.prompt('复制这个链接发给朋友：', location.href); }
    setTimeout(() => { b.textContent = '邀请'; }, 1500);
  };
  connect();
  setInterval(sendPose, 1000 / NET_HZ);
}

// ---------------- loop ----------------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); perspCam.aspect = w / h;
  perspCam.fov = w < 640 ? 46 : 36; perspCam.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const v3 = new THREE.Vector3();
let uiT = 0, jumps = 0;
function updateUI(dt) {
  const pw = fish.chargePower();
  ui.chargeBar.classList.toggle('on', fish.charging());
  ui.power.style.transform = `scaleX(${pw.toFixed(3)})`;
  uiT += dt; if (uiT < 0.08) return; uiT = 0;
  ui.energy.style.transform = `scaleX(${fish.energy.toFixed(3)})`;
  ui.energy.style.background = fish.energy < 0.3 ? 'var(--accent)' : 'var(--fish)';
  ui.energyBar.setAttribute('aria-valuenow', String(Math.round(fish.energy * 100)));
  if (jumps >= 2) ui.hint.classList.add('gone');
}

const clock = new THREE.Clock(); let acc = 0; const STEP = 1 / 60;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  acc += dt;
  while (acc >= STEP) {
    if (testFish) {
      const practice = testFish.controller.fish;
      fish.update(STEP, false); testFish.controller.update(STEP);
      fish.touch.fill(false); practice.touch.fill(false);
      const h = STEP / fish.substeps;
      for (let s = 0; s < fish.substeps; s++) {
        fish.substep(h); practice.substep(h);
        if ((s + 1) % 5 === 0) resolveFishPair(fish, practice);
      }
    } else fish.update(STEP);
    acc -= STEP;
    for (const e of fish.events) if (e === 'air') jumps++;
    fish.events.length = 0;
  }
  // holding through a jump: start charging the moment the fish comes to rest
  if (holding && !fish.charging() && fish.canCharge()) fish.beginCharge();
  if (holding) updateAim();
  updateAimVisual();

  // skin
  applySkin(dt);
  rig.updateMatrixWorld(true);
  updateTestSkin();
  updateRemotes();

  // camera follows a filtered focus point (see makeFollow) without taking the orbit away from the viewer
  const ft = follow.update(dt);
  v3.fromArray(ft).sub(controls.target);
  controls.target.add(v3); camera.position.add(v3);
  placeSun(ft);
  controls.update();
  updateUI(dt);
  renderFrame();
  requestAnimationFrame(frame);
}
dropFish();
requestAnimationFrame(frame);
startNet();
</script>
