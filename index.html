<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>剑鱼 · 程序化动画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: full-bleed 3D stage; one frosted instrument panel docked top-left (bottom sheet on phones). */
:root {
  --stage: #eceef5;        /* scene background, lavender-tinged white */
  --floor: #f4f5f9;
  --grid: #dcdfeb;
  --grid-major: #c7cbdd;
  --box-top: #f8f9fc;
  --box-side: #c3c8dc;
  --box-edge: #a9afc9;
  --panel: rgba(250, 251, 254, 0.88);
  --panel-line: #d7dbe8;
  --ink: #1a2142;
  --muted: #5b6386;
  --fish: #24378a;
  --accent: #dd6a1c;        /* targets, trajectory: complement of the fish blue */
  --accent-ink: #ffffff;
  --chip: #e3e7f3;
  --debug: #0f9b8e;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #10152a; --floor: #141a32; --grid: #1e2643; --grid-major: #2c365e;
    --box-top: #2a3258; --box-side: #1b2242; --box-edge: #3c4775;
    --panel: rgba(20, 26, 48, 0.86); --panel-line: #2c355a;
    --ink: #e7eaf7; --muted: #9ba4c8; --fish: #9fb4ff;
    --accent: #f2913f; --accent-ink: #1a1206; --chip: #232b4d; --debug: #3ed6c4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #10152a; --floor: #141a32; --grid: #1e2643; --grid-major: #2c365e;
  --box-top: #2a3258; --box-side: #1b2242; --box-edge: #3c4775;
  --panel: rgba(20, 26, 48, 0.86); --panel-line: #2c355a;
  --ink: #e7eaf7; --muted: #9ba4c8; --fish: #9fb4ff;
  --accent: #f2913f; --accent-ink: #1a1206; --chip: #232b4d; --debug: #3ed6c4;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--stage); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  overflow: hidden;
}
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; outline: none; }
.brand {
  position: fixed; pointer-events: none; margin: 0;
  left: max(18px, env(safe-area-inset-left, 0px)); top: max(14px, env(safe-area-inset-top, 0px));
  font-family: var(--font-display); font-weight: 900; font-size: 26px; letter-spacing: 0.06em; color: var(--fish); line-height: 1; opacity: 0.85;
}
.redrop {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: max(14px, env(safe-area-inset-top, 0px));
  font: inherit; font-size: 12px; color: var(--ink); cursor: pointer;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px; padding: 4px 12px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.redrop:hover { border-color: var(--ink); }
.redrop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.redrop kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-left: 4px; }
/* bottom HUD: stamina always, charge only while the fish is curled */
.hud {
  position: fixed; left: 50%; transform: translateX(-50%); pointer-events: none;
  bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  width: min(320px, calc(100% - 48px)); display: grid; gap: 7px; justify-items: center;
}
.bar { width: 100%; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; border-radius: 3px; transform-origin: left; background: var(--fish); }
.bar.charge { height: 8px; opacity: 0; transition: opacity 0.12s; }
.bar.charge i { background: var(--accent); transform: scaleX(0); }
.bar.charge.on { opacity: 1; }
.hint { margin: 2px 0 0; font-size: 12px; color: var(--muted); text-align: center; transition: opacity 0.8s; }
.hint.gone { opacity: 0; }
.tune {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: max(52px, calc(env(safe-area-inset-top, 0px) + 50px));
  width: min(300px, calc(100% - 32px)); max-height: calc(100vh - 140px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 12px 14px;
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  font-size: 12px; display: grid; gap: 10px;
}
.tune[hidden] { display: none; }
.tune header { display: flex; align-items: baseline; justify-content: space-between; }
.tune header b { font-size: 13px; }
.tune header small, .tune .desc { color: var(--muted); }
.tune h3 { margin: 4px 0 -2px; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; color: var(--muted); }
.tune label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.tune label.chk input { grid-column: auto; width: auto; justify-self: end; }
.tune label input { grid-column: 1 / -1; width: 100%; accent-color: var(--fish); margin: 0; }
.tune .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.tune .desc { grid-column: 1 / -1; font-size: 11px; line-height: 1.4; }
.tune .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.tune button { font: inherit; font-size: 12px; color: var(--ink); background: transparent; cursor: pointer; border: 1px solid var(--panel-line); border-radius: 999px; padding: 3px 11px; }
.tune button:hover { border-color: var(--ink); }
.err { position: fixed; left: 16px; top: 56px; padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<canvas id="view" tabindex="0" aria-label="剑鱼三维场景：按住鼠标左键蓄力，松开朝鼠标方向跳跃"></canvas>

<h1 class="brand">剑鱼</h1>
<button class="redrop" id="btnDrop" title="把鱼重新从天上扔下来">重新投放<kbd>R</kbd></button>
<section class="tune" id="tune" hidden aria-label="手感参数"></section>
<div class="hud">
  <div class="bar charge" id="chargeBar" aria-hidden="true"><i id="power"></i></div>
  <div class="bar" role="meter" aria-label="体力" aria-valuemin="0" aria-valuemax="100" id="energyBar"><i id="energy"></i></div>
  <p class="hint" id="hint">按住左键蓄力，松开朝鼠标方向跳 · 右键拖动转视角 · 滚轮缩放 · T 调手感</p>
</div>

<script>
// SIM-BEGIN
// Swordfish procedural animation core: XPBD rigid-body chain + spring muscles + jump brain.
// Pure JS, no rendering dependencies. Vectors are [x,y,z], quaternions [x,y,z,w].
(function (root) {
  'use strict';
  const G = 9.81;

  // ---------- small math ----------
  const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const vsc = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const vlen = (a) => Math.hypot(a[0], a[1], a[2]);
  const vnorm = (a) => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

  function qmul(a, b) {
    return [
      a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
      a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
      a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
      a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
    ];
  }
  const qconj = (q) => [-q[0], -q[1], -q[2], q[3]];
  function qrot(q, v) {
    const ux = q[0], uy = q[1], uz = q[2], w = q[3];
    const tx = 2 * (uy * v[2] - uz * v[1]), ty = 2 * (uz * v[0] - ux * v[2]), tz = 2 * (ux * v[1] - uy * v[0]);
    return [v[0] + w * tx + uy * tz - uz * ty, v[1] + w * ty + uz * tx - ux * tz, v[2] + w * tz + ux * ty - uy * tx];
  }
  const qaxis = (ax, ang) => { const s = Math.sin(ang / 2); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(ang / 2)]; };
  function qaddRot(q, r) { // q += 0.5 * [r,0] * q  (small rotation vector r)
    const d = qmul([r[0], r[1], r[2], 0], q);
    q[0] += 0.5 * d[0]; q[1] += 0.5 * d[1]; q[2] += 0.5 * d[2]; q[3] += 0.5 * d[3];
    const n = Math.hypot(q[0], q[1], q[2], q[3]);
    q[0] /= n; q[1] /= n; q[2] /= n; q[3] /= n;
  }
  function qFromBasis(x, y, z) { // columns of rotation matrix
    const m00 = x[0], m10 = x[1], m20 = x[2], m01 = y[0], m11 = y[1], m21 = y[2], m02 = z[0], m12 = z[1], m22 = z[2];
    const tr = m00 + m11 + m22; let qx, qy, qz, qw;
    if (tr > 0) { const s = 0.5 / Math.sqrt(tr + 1); qw = 0.25 / s; qx = (m21 - m12) * s; qy = (m02 - m20) * s; qz = (m10 - m01) * s; }
    else if (m00 > m11 && m00 > m22) { const s = 2 * Math.sqrt(1 + m00 - m11 - m22); qw = (m21 - m12) / s; qx = 0.25 * s; qy = (m01 + m10) / s; qz = (m02 + m20) / s; }
    else if (m11 > m22) { const s = 2 * Math.sqrt(1 + m11 - m00 - m22); qw = (m02 - m20) / s; qx = (m01 + m10) / s; qy = 0.25 * s; qz = (m12 + m21) / s; }
    else { const s = 2 * Math.sqrt(1 + m22 - m00 - m11); qw = (m10 - m01) / s; qx = (m02 + m20) / s; qy = (m12 + m21) / s; qz = 0.25 * s; }
    const n = Math.hypot(qx, qy, qz, qw); return [qx / n, qy / n, qz / n, qw / n];
  }

  // ---------- rigid body ----------
  class Body {
    constructor(m, I) {
      this.m = m; this.invM = 1 / m; this.invI = [1 / I[0], 1 / I[1], 1 / I[2]];
      this.x = [0, 0, 0]; this.q = [0, 0, 0, 1]; this.v = [0, 0, 0]; this.w = [0, 0, 0];
      this.px = [0, 0, 0]; this.pq = [0, 0, 0, 1];
    }
    invIw(u) { const b = qrot(qconj(this.q), u); return qrot(this.q, [b[0] * this.invI[0], b[1] * this.invI[1], b[2] * this.invI[2]]); }
    angInvMass(n) { const b = qrot(qconj(this.q), n); return b[0] * b[0] * this.invI[0] + b[1] * b[1] * this.invI[1] + b[2] * b[2] * this.invI[2]; }
    genInvMass(r, n) { return this.invM + this.angInvMass(vcross(r, n)); }
    applyPos(p, r, sign) {
      this.x[0] += sign * p[0] * this.invM; this.x[1] += sign * p[1] * this.invM; this.x[2] += sign * p[2] * this.invM;
      qaddRot(this.q, vsc(this.invIw(vcross(r, p)), sign));
    }
    applyRot(p, sign) { qaddRot(this.q, vsc(this.invIw(p), sign)); }
    applyVelImpulse(p, r, sign) {
      for (let k = 0; k < 3; k++) this.v[k] += sign * p[k] * this.invM;
      const dw = this.invIw(vcross(r, p)); for (let k = 0; k < 3; k++) this.w[k] += sign * dw[k];
    }
  }

  // XPBD positional correction: moves point p1 by a share of `corr`, point p2 by the opposite share.
  function posCorr(b1, r1, b2, r2, corr, alphaT) {
    const c = vlen(corr); if (c < 1e-10) return 0;
    const n = vsc(corr, 1 / c);
    const w1 = b1 ? b1.genInvMass(r1, n) : 0, w2 = b2 ? b2.genInvMass(r2, n) : 0;
    const dl = c / (w1 + w2 + alphaT); const p = vsc(n, dl);
    if (b1) b1.applyPos(p, r1, +1); if (b2) b2.applyPos(p, r2, -1);
    return dl;
  }
  // XPBD angular correction: body2 rotates by +share of dphi, body1 by the opposite share.
  function angCorr(b1, b2, dphi, alphaT) {
    const c = vlen(dphi); if (c < 1e-10) return 0;
    const n = vsc(dphi, 1 / c);
    const dl = c / (b1.angInvMass(n) + b2.angInvMass(n) + alphaT); const p = vsc(n, dl);
    b1.applyRot(p, -1); b2.applyRot(p, +1);
    return dl;
  }

  // ---------- world ----------
  class World {
    constructor(boxes) { this.boxes = boxes || []; }
    height(x, z) {
      let h = 0;
      for (const b of this.boxes) if (Math.abs(x - b.cx) <= b.hx && Math.abs(z - b.cz) <= b.hz && b.h > h) h = b.h;
      return h;
    }
    boxAt(x, z) {
      let best = null;
      for (const b of this.boxes) if (Math.abs(x - b.cx) <= b.hx && Math.abs(z - b.cz) <= b.hz && (!best || b.h > best.h)) best = b;
      return best;
    }
  }

  // ---------- fish definition ----------
  // Segments head -> tail. L: length, ay: dorsal half-height, az: lateral half-width (fish is laterally flat).
  const SEGS = [
    { L: 0.52, ay: 0.016, az: 0.032, name: 'bill' },
    { L: 0.26, ay: 0.12, az: 0.075 },
    { L: 0.22, ay: 0.165, az: 0.09 },
    { L: 0.22, ay: 0.17, az: 0.092 },
    { L: 0.20, ay: 0.15, az: 0.082 },
    { L: 0.18, ay: 0.12, az: 0.066 },
    { L: 0.16, ay: 0.088, az: 0.05 },
    { L: 0.14, ay: 0.06, az: 0.036 },
    { L: 0.12, ay: 0.036, az: 0.026 },
    { L: 0.10, ay: 0.03, az: 0.022, cay: 0.26, name: 'tail' },
  ];
  const N = SEGS.length;
  const TOTAL = SEGS.reduce((s, g) => s + g.L, 0);
  // Arc-length (from bill tip) of each segment's center, and joint boundaries.
  const CENTERS = [], BOUNDS = [0];
  { let u = 0; for (const g of SEGS) { CENTERS.push(u + g.L / 2); u += g.L; BOUNDS.push(u); } }
  // How strongly each body joint participates in the C-curl (joint i links seg i and i+1).
  const CURL_PROFILE = [0, 0.55, 0.8, 1.0, 1.0, 1.0, 0.95, 0.85, 0.7];
  const PROF_SUM = CURL_PROFILE.reduce((a, b) => a + b, 0);

  // Tunable feel parameters (multipliers are 1 = original behaviour).
  const TUNE_DEFAULTS = {
    soft: 1,      // muscle compliance multiplier: higher = softer, floppier muscles
    damp: 1,      // joint damping multiplier: higher = less wobble between segments
    landLimp: 1,  // extra muscle slack right after touchdown: higher = body goes limp on landing
    absorb: 7,    // landing energy absorption rate (1/s): higher = slides/spins stop sooner
    bounce: 0,    // share of rebound velocity soaked up at contacts: 1 = no bounce at all
    friction: 1,  // ground friction multiplier
    curl: 1,      // charge curl amplitude multiplier
    arch: 1,      // in-flight body arch multiplier
    idle: 1,      // resting tail-twitch amplitude multiplier
  };
  const STATE_LABEL = { drop: '下落', rest: '休息', charge: '蓄力', slap: '拍尾', air: '腾空', land: '落地' };

  class Fish {
    constructor(world) {
      this.world = world;
      this.bodies = SEGS.map((g, i) => {
        const rho = 760;
        let m = Math.PI * g.ay * g.az * g.L * rho;
        if (i === N - 1) m += 0.5; // caudal fin
        m = Math.max(m, 0.5);
        const ay = g.cay || g.ay;
        const I = [m * (ay * ay + g.az * g.az) / 4, m * (g.az * g.az / 4 + g.L * g.L / 12), m * (ay * ay / 4 + g.L * g.L / 12)];
        return new Body(m, I);
      });
      this.mass = this.bodies.reduce((s, b) => s + b.m, 0);
      // contact sample positions along each segment's local x
      this.samples = SEGS.map((g, i) => i === 0 ? [0, 0.5 * g.L] : i === N - 1 ? [-0.5 * g.L, 0] : [-0.45 * g.L, 0, 0.45 * g.L]);
      this.theta = new Array(N - 1).fill(0);   // muscle target angles (rad), about each segment's dorsal axis
      this.alpha = new Array(N - 1).fill(4e-5); // muscle compliance (lower = stronger)
      this.kd = 4;                              // joint damping
      this.mu = 0.55;                           // ground friction
      this.substeps = 20;
      this.tune = Object.assign({}, TUNE_DEFAULTS);
      this.contacts = [];
      this.touch = new Array(N).fill(false);
      this.queue = [];
      this.energy = 1;
      this.state = 'rest'; this.stateT = 0; this.t = 0;
      this.hop = null; this.traj = null; this.lastJump = null;
      this.events = [];
      this.reset([0, 0, 0], 0, 1);
      // Measure the resting center-of-mass height once, used by the ballistic solver as landing height.
      for (let i = 0; i < 90; i++) this.physics(1 / 60);
      this.restH = this.com()[1];
      this.reset([0, 0, 0], 0, 1);
    }

    reset(pos, yaw, side) {
      side = side || 1;
      const hx = [Math.cos(yaw), 0, -Math.sin(yaw)];       // heading (local +x)
      const z = [0, side, 0];                              // lateral axis points up: lying on its side
      const y = vcross(z, hx);
      const q = qFromBasis(hx, y, z);
      // place COM (approximately the body middle) at pos
      const mid = TOTAL * 0.48;
      this.bodies.forEach((b, i) => {
        const off = mid - CENTERS[i];
        b.x = [pos[0] + hx[0] * off, Math.max(SEGS[i].az, 0.03) + 0.005 + this.world.height(pos[0], pos[2]), pos[2] + hx[2] * off];
        b.q = q.slice(); b.v = [0, 0, 0]; b.w = [0, 0, 0];
        b.px = b.x.slice(); b.pq = b.q.slice();
      });
      this.theta.fill(0); this.alpha.fill(4e-5);
      this.state = 'rest'; this.stateT = 0; this.hop = null; this.traj = null;
    }

    // Spawn in the sky: same lying pose, lifted by `height`, with a slow tumble so it lands a bit askew.
    drop(pos, yaw, height) {
      this.reset(pos, yaw, Math.random() < 0.5 ? 1 : -1);
      this.energy = 1; this.lastJump = null; this.queue.length = 0;
      const h = this.heading(), lat = vcross(h, [0, 1, 0]);
      const w = vadd(vsc(h, (Math.random() - 0.5) * 2.4), vsc(lat, (Math.random() - 0.5) * 1.2));
      for (const b of this.bodies) b.x[1] += height;
      const c = this.com();
      for (const b of this.bodies) { b.px = b.x.slice(); b.v = vcross(w, vsub(b.x, c)); b.w = w.slice(); }
      this.enterState('drop');
    }

    com() {
      const c = [0, 0, 0];
      for (const b of this.bodies) { c[0] += b.x[0] * b.m; c[1] += b.x[1] * b.m; c[2] += b.x[2] * b.m; }
      return vsc(c, 1 / this.mass);
    }
    comVel() {
      const c = [0, 0, 0];
      for (const b of this.bodies) { c[0] += b.v[0] * b.m; c[1] += b.v[1] * b.m; c[2] += b.v[2] * b.m; }
      return vsc(c, 1 / this.mass);
    }
    angMom() { // about COM
      const c = this.com(); let L = [0, 0, 0];
      for (const b of this.bodies) {
        L = vadd(L, vsc(vcross(vsub(b.x, c), b.v), b.m));
        const wb = qrot(qconj(b.q), b.w); const Iw = [wb[0] / b.invI[0], wb[1] / b.invI[1], wb[2] / b.invI[2]];
        L = vadd(L, qrot(b.q, Iw));
      }
      return L;
    }
    side() { const z = qrot(this.bodies[3].q, [0, 0, 1]); return z[1] >= 0 ? 1 : -1; }
    heading() {
      const a = this.bodies[1].x, b = this.bodies[8].x;
      const d = [a[0] - b[0], 0, a[2] - b[2]]; const l = Math.hypot(d[0], d[2]);
      return l < 1e-4 ? vnorm(qrot(this.bodies[3].q, [1, 0, 0]).map((v, k) => k === 1 ? 0 : v)) : [d[0] / l, 0, d[2] / l];
    }

function monotone(xs, ys) { // Fritsch–Carlson monotone cubic
  const n = xs.length, d = [], m = new Array(n);

  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {

    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }

  return (x) => {
    if (x <= xs[0]) return ys[0]; if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (xs[i + 1] < x) i++;

}

window.addEventListener('keydown', (e) => {

// ---------------- skin with flesh jiggle ----------------
// Each bone's drawn transform chases the physics transform through a damped spring; the result is
// blended toward the physics pose by a weight that grows toward the tail. Bill and head stay rigid.
const jig = SEGS.map(() => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), q: new THREE.Quaternion(), w: new THREE.Vector3() }));

let jigInit = false;
function snapJiggle() { jigInit = false; }
function applySkin(dt) {
  if (!jigInit) {
    fish.bodies.forEach((b, i) => { jig[i].p.fromArray(b.x); jig[i].v.set(0, 0, 0); jig[i].q.fromArray(b.q); jig[i].w.set(0, 0, 0); });

    }

    bones[i].position.copy(tp).lerp(J.p, amt);
    bones[i].quaternion.copy(tq).slerp(J.q, amt);

}


// ---------------- pixel-art rendering (after KodyJKing/hello-threejs) ----------------
// Low-res render through an orthographic camera, plus a normal pass; a fullscreen shader darkens
// depth discontinuities (outlines), brightens normal creases (highlights) and upscales with nearest sampling.
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 80);
const ORTHO_H = 3;      // half-height of the ortho frustum at zoom 1 (m)
const ORTHO_DIST = 20;  // ortho camera distance from the orbit target (only clipping matters; within controls.maxDistance)
let camera = perspCam;
function frustumHeightAt(d) { return 2 * d * Math.tan(THREE.MathUtils.degToRad(perspCam.fov) / 2); }

  if (on) {

    perspCam.position.copy(controls.target).addScaledVector(dir, d);

controls.minZoom = 0.35; controls.maxZoom = 4;

function pixelTarget(w, h, depth) {

const normalMat = new THREE.MeshNormalMaterial();
const pixelMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null }, tDepth: { value: null }, tNormal: { value: null },
    resolution: { value: new THREE.Vector4() },
    cameraNear: { value: 0.1 }, cameraFar: { value: 80 },
    depthEdge: { value: 0.4 }, normalEdge: { value: 0.3 }, depthThresh: { value: 0.08 }, levels: { value: 0 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse, tDepth, tNormal;
    uniform vec4 resolution;
    uniform float cameraNear, cameraFar, depthEdge, normalEdge, depthThresh, levels;
    varying vec2 vUv;
    // orthographic depth is linear: convert to metres along the view axis
    float getDepth(int x, int y) { return cameraNear + texture2D(tDepth, vUv + vec2(x, y) * resolution.zw).r * (cameraFar - cameraNear); }

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), pixelMat); quad.frustumCulled = false; quadScene.add(quad);
const camRight = new THREE.Vector3(), camUp = new THREE.Vector3(), camShift = new THREE.Vector3();

function renderFrame() {
  useOrtho(viz.pixel >= 0.5);
  if (camera !== orthoCam) { renderer.setRenderTarget(null); renderer.render(scene, camera); return; }
  const ps = Math.max(1, Math.round(viz.pixelSize));
  const w = Math.max(1, Math.ceil(window.innerWidth / ps)), h = Math.max(1, Math.ceil(window.innerHeight / ps));
  if (!rgbRT || w !== rtW || h !== rtH) {

  orthoCam.updateProjectionMatrix();

  camShift.set(0, 0, 0);

    camRight.setFromMatrixColumn(orthoCam.matrixWorld, 0); camUp.setFromMatrixColumn(orthoCam.matrixWorld, 1);

  u.tDiffuse.value = rgbRT.texture; u.tDepth.value = rgbRT.depthTexture; u.tNormal.value = nrmRT.texture;

// hold left button to charge, release to jump toward the pointer
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

let holding = false, pointerId = null, hasAim = false;
function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function updateAim() { // pointer -> point on floor / step tops (falls back to the ground plane)
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([floor, ...boxMeshes], false)[0];
  if (hit) { aimPoint.copy(hit.point); hasAim = true; }
  else hasAim = !!ray.ray.intersectPlane(groundPlane, aimPoint);
}
function aimDir() {
  const c = fish.com();
  return hasAim ? [aimPoint.x - c[0], 0, aimPoint.z - c[2]] : fish.heading();
}
canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || holding) return;
  holding = true; pointerId = e.pointerId; setPointer(e); updateAim();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  fish.beginCharge(); // if the fish is still busy, charging starts as soon as it comes to rest
});
canvas.addEventListener('pointermove', (e) => {
  setPointer(e);
  if (holding && e.pointerId === pointerId && e.pointerType === 'mouse' && (e.buttons & 1) === 0) endHold(e); // missed mouseup
});
canvas.addEventListener('lostpointercapture', (e) => { if (holding && e.pointerId === pointerId) endHold(null); }); // aim from the last move, not this event
function endHold(e) {
  if (!holding || (e && e.pointerId !== pointerId)) return;
  holding = false; pointerId = null;
  if (e) setPointer(e);
  updateAim();
  fish.release(aimDir());
}
window.addEventListener('pointerup', endHold);
window.addEventListener('pointercancel', endHold);
window.addEventListener('blur', () => endHold(null));

// aim preview: dashed ground line from the fish toward the pointer, ring at the landing spot it would reach now
const aimLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), aimMat);
aimLine.renderOrder = 6; aimLine.visible = false; scene.add(aimLine);
const aimRing = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.2, 40), aimRingMat);
aimRing.rotation.x = -Math.PI / 2; aimRing.renderOrder = 6; aimRing.visible = false; scene.add(aimRing);
function updateAimVisual() {
  const show = holding && hasAim;
  aimLine.visible = aimRing.visible = show;
  if (!show) return;
  const c = fish.com(); const d = aimDir(); const l = Math.hypot(d[0], d[2]) || 1;
  const dist = fish.manualReach(fish.chargePower());
  const x = c[0] + d[0] / l * dist, z = c[2] + d[2] / l * dist;
  const p = aimLine.geometry.attributes.position;
  p.setXYZ(0, c[0], world.height(c[0], c[2]) + 0.012, c[2]);
  p.setXYZ(1, x, world.height(x, z) + 0.012, z);
  p.needsUpdate = true; aimLine.geometry.computeBoundingSphere(); aimLine.computeLineDistances();
  aimRing.position.set(x, world.height(x, z) + 0.012, z);
  const ready = fish.charging();
  aimMat.opacity = ready ? 0.95 : 0.4; aimRingMat.opacity = ready ? 0.95 : 0.4;
  aimRing.scale.setScalar(fish.chargePower() >= 1 ? 1 + 0.08 * Math.sin(performance.now() / 60) : 1);
}

// Camera focus that ignores the fish's small motions (idle tail twitch, landing wobble, charge curl).
// Hysteresis: the focus stays put until the fish has really moved away, then glides over and parks again.
// Height follows the ground under the fish, not its bobbing centre of mass.
function makeFollow(fish, world) {
  const t = [0, 0.2, 0];
  let chasing = true;
  const START = 0.45, STOP = 0.04, RATE = 3.2;
  return {
    target: t,
    snap(p) { t[0] = p[0]; t[1] = world.height(p[0], p[2]) + 0.2; t[2] = p[2]; chasing = false; },
    update(dt) {
      const c = fish.com();
      const ex = c[0] - t[0], ez = c[2] - t[2], e = Math.hypot(ex, ez);
      const moving = fish.state === 'air' && fish.stateT > 0.05; // not during the slap: the COM jerks backwards before take-off
      if (!chasing && (e > START || moving)) chasing = true;
      if (chasing && !moving && fish.state !== 'drop' && e < STOP) chasing = false;
      const k = 1 - Math.exp(-RATE * dt);
      if (chasing) { t[0] += ex * k; t[2] += ez * k; }

const follow = makeFollow(fish, world);

// Shadow map: follow the (already filtered) camera focus, snapped to whole shadow texels in light space,
// so shadow edges don't crawl when the focus glides.
const SUN_OFFSET = new THREE.Vector3(-3, 9, 4);
const sunDir = SUN_OFFSET.clone().negate().normalize();
const sunRight = new THREE.Vector3().crossVectors(sunDir, new THREE.Vector3(0, 1, 0)).normalize();
const sunUp = new THREE.Vector3().crossVectors(sunRight, sunDir);
const sunTexel = (sun.shadow.camera.right - sun.shadow.camera.left) / sun.shadow.mapSize.x;
const sunFocus = new THREE.Vector3();
function placeSun(t) {
  sunFocus.fromArray(t); sunFocus.y = 0;
  const a = Math.round(sunFocus.dot(sunRight) / sunTexel) * sunTexel, b = Math.round(sunFocus.dot(sunUp) / sunTexel) * sunTexel, c = sunFocus.dot(sunDir);
  sunFocus.copy(sunRight).multiplyScalar(a).addScaledVector(sunUp, b).addScaledVector(sunDir, c);
  sun.target.position.copy(sunFocus); sun.position.copy(sunFocus).add(SUN_OFFSET);
}

// ---------------- loop ----------------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); perspCam.aspect = w / h;
  perspCam.fov = w < 640 ? 46 : 36; perspCam.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const v3 = new THREE.Vector3();
let uiT = 0, jumps = 0;
function updateUI(dt) {
  const pw = fish.chargePower();
  ui.chargeBar.classList.toggle('on', fish.charging());
  ui.power.style.transform = `scaleX(${pw.toFixed(3)})`;
  uiT += dt; if (uiT < 0.08) return; uiT = 0;
  ui.energy.style.transform = `scaleX(${fish.energy.toFixed(3)})`;
  ui.energy.style.background = fish.energy < 0.3 ? 'var(--accent)' : 'var(--fish)';
  ui.energyBar.setAttribute('aria-valuenow', String(Math.round(fish.energy * 100)));
  if (jumps >= 2) ui.hint.classList.add('gone');
}

const clock = new THREE.Clock(); let acc = 0; const STEP = 1 / 60;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  acc += dt;
  while (acc >= STEP) {
    fish.update(STEP); acc -= STEP;
    for (const e of fish.events) if (e === 'air') jumps++;
    fish.events.length = 0;

  // holding through a jump: start charging the moment the fish comes to rest
  if (holding && !fish.charging() && fish.canCharge()) fish.beginCharge();
  if (holding) updateAim();
  updateAimVisual();

  // skin
  applySkin(dt);
  rig.updateMatrixWorld(true);

  // camera follows a filtered focus point (see makeFollow) without taking the orbit away from the viewer
  const ft = follow.update(dt);
  v3.fromArray(ft).sub(controls.target);
  controls.target.add(v3); camera.position.add(v3);
  placeSun(ft);
  controls.update();
  updateUI(dt);
  renderFrame();

}
dropFish();
requestAnimationFrame(frame);
</script>
